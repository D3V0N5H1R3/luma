id = "luma"
name = "Luma"
description = "Syntax highlighting, language configuration, snippets, and language server integration for the Luma programming language."
version = "0.11.0"
schema_version = 1
authors = ["Luma Contributors"]
repository = "https://github.com/d3v0n5h1r3/luma"

# Declares that this extension ships a compiled Rust/WASM library. Zed only
# builds and loads the WASM component when `kind = "Rust"` is present, and the
# debug adapter (get_dap_binary and the dap_* hooks in src/lib.rs) is registered
# solely for extensions with a loaded WASM component. Without this section the
# Luma adapter never appears in the "debugger: start" picker. The `version` is
# the zed_extension_api version and is refreshed from the compiled WASM at build
# time; it is pinned here to match Cargo.toml.
[lib]
kind = "Rust"
version = "0.7.0"

snippets = ["snippets/luma.json"]

[grammars.luma]
repository = "https://github.com/D3V0N5H1R3/luma"
rev = "main"
path = "extensions/zed/grammars/tree-sitter-luma"

[language_servers.luma-lsp]
name = "Luma Language Server"
languages = ["Luma"]
language_ids = { Luma = "luma" }

[language_servers.luma-lsp.binary]
path = "bin/luma_lsp"
fetch_script = "scripts/download_binaries.sh"

# Debug Adapter Protocol support. The adapter name ("Luma") is what appears in
# Zed's debugger picker (New Process modal / debug.json `adapter` field). The
# `luma_dap` binary is resolved in `get_dap_binary` (PATH first, then download),
# so no `command` is declared here. A JSON schema is mandatory; it powers
# completion and validation of the launch configuration in debug.json.
[debug_adapters.Luma]
schema_path = "debug_adapter_schemas/luma.json"

# Locator that turns the Luma "run" task (see languages/luma/tasks.json) into a
# debug session, so the editor can offer "Debug" wherever it offers "Run".
[debug_locators.luma]
