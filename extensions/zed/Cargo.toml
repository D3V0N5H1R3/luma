[package]
name = "luma-zed"
version = "0.5.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
sha2 = "0.11.0"
# Pure-Rust archive extraction so the verified archive bytes can be unpacked
# in-process inside Zed's WASM sandbox (no second download, closing the TOCTOU
# gap). `default-features = false` drops the C/zlib and unix-only (xattr) paths
# that do not build for wasm32-wasip1; `rust_backend` selects miniz_oxide.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
# Pin typed-path to 0.12.3+ — versions 0.12.1–0.12.2 use `#![feature(wasip2)]`
# behind a cfg gate that fires when Zed's extension builder compiles for
# wasm32-wasip2, which requires nightly Rust and breaks the stable-channel build.
# v0.12.3 fixed the issue.
typed-path = ">=0.12.3"

# Make the lint policy enforced by CI (`cargo clippy -- -D warnings`) part of
# the version-controlled manifest so it also applies to local `cargo clippy`
# runs and editors. `priority = -1` lets individual lint overrides added later
# take precedence over the group default.
[lints.clippy]
all = { level = "deny", priority = -1 }
