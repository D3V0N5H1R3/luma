version: 2

updates:
  # GitHub Actions workflow and composite-action dependencies. "/" only covers
  # .github/workflows; the composite actions under .github/actions/ must be
  # listed explicitly or their pins silently drift behind the workflows'.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # npm dependencies for the editor extensions and their test tooling.
  - package-ecosystem: "npm"
    directories:
      - "/extensions/vscode"
      - "/extensions/tests"
      - "/extensions/zed/grammars/tree-sitter-luma"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint (and tslib) peer-require typescript "<6.1.0", so the
      # TypeScript 7.x "native" line breaks `npm ci` (ERESOLVE) and CI. Hold
      # major TypeScript bumps until typescript-eslint officially supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Cargo (Rust) dependencies for the Zed extension and its Tree-sitter grammar.
  - package-ecosystem: "cargo"
    directories:
      - "/extensions/zed"
      - "/extensions/zed/grammars/tree-sitter-luma"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns: ["*"]
