# ─────────────────────────────────────────────────────────────
# Composite action: build-zed-extension
#
# Installs the Rust WASM toolchain, restores the Cargo cache, and
# checks, lints, tests, and builds the Zed extension. Shared by the
# Zed CI and release workflows.
# ─────────────────────────────────────────────────────────────

name: Build Zed Extension
description: Install the Rust WASM toolchain and check, lint, test, and build the Zed extension.

inputs:
  working-directory:
    description: Path to the Zed extension directory.
    required: false
    default: extensions/zed

runs:
  using: composite
  steps:
    # The SHA pins this action's code; `toolchain: stable` still resolves to the
    # newest stable Rust at run time, which is why the cache key below includes
    # the resolved compiler (`cachekey`).
    - name: Install Rust toolchain
      id: toolchain
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable (1.94.1)
      with:
        toolchain: stable
        targets: wasm32-wasip1
        components: clippy,rustfmt

    # Keyed on the OS, the resolved rustc, and Cargo.lock so a new compiler or
    # dependency set starts a fresh entry instead of restoring stale artefacts
    # into an ever-growing target/ directory.
    - name: Cache Cargo registry and build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.working-directory }}/target
        key: cargo-zed-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory)) }}
        restore-keys: |
          cargo-zed-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

    - name: Check formatting
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo fmt --check

    - name: Check compilation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo check --target wasm32-wasip1

    - name: Run Clippy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo clippy --target wasm32-wasip1 -- -D warnings

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo test

    - name: Build release WASM
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo build --release --target wasm32-wasip1
