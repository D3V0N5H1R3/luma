# ─────────────────────────────────────────────────────────────
# Composite action: build-vscode-extension
#
# Sets up Node.js, installs dependencies, type-checks, compiles,
# and packages the VS Code extension into a .vsix. Shared by the
# VS Code CI, release, and the bundled-in-core release workflow.
# ─────────────────────────────────────────────────────────────

name: Build VS Code Extension
description: Install, type-check, compile, and package the Luma VS Code extension.

inputs:
  working-directory:
    description: Path to the VS Code extension directory.
    required: false
    default: extensions/vscode

outputs:
  vsix-file:
    description: Filename of the packaged .vsix (relative to working-directory).
    value: ${{ steps.verify.outputs.vsix-file }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Type check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx tsc --noEmit

    - name: Compile TypeScript
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run compile

    - name: Package extension
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Use the lockfile-pinned vsce from `npm ci` above rather than `npx vsce`,
      # which can silently fetch an unpinned version from the registry.
      run: ./node_modules/.bin/vsce package --no-dependencies

    - name: Verify .vsix artifact
      id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        vsix=$(ls *.vsix 2>/dev/null | head -1)
        if [ -z "$vsix" ]; then
          echo "::error::.vsix package not found"
          exit 1
        fi
        echo "vsix-file=$vsix" >> "$GITHUB_OUTPUT"
        echo "Packaged: $vsix"
