# ─────────────────────────────────────────────────────────────
# Composite action: cmake-build
#
# Configures and builds the Luma project with CMake. Hides the
# Unix/Windows configure differences behind a single step so the
# calling workflows do not each duplicate them.
#
# On Unix the compilers can be selected via the `cc`/`cxx`
# inputs. On Windows the default MSVC toolchain is used (the
# Visual Studio generator ignores CMAKE_*_COMPILER overrides).
# ─────────────────────────────────────────────────────────────

name: CMake Build
description: Configure and build the Luma project with CMake (cross-platform).

inputs:
  build-type:
    description: CMake build type (Debug, Release, ...).
    required: false
    default: Release
  build-dir:
    description: Build directory to configure into.
    required: false
    default: build
  cc:
    description: C compiler to use (Unix only; optional).
    required: false
    default: ""
  cxx:
    description: C++ compiler to use (Unix only; optional).
    required: false
    default: ""
  extra-args:
    description: Extra arguments appended to the CMake configure command.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Xcode 16 (the default on the macos-15-intel image) ships a libc++ whose
    # C++20 support is incomplete: std::jthread and std::stop_token are hidden
    # behind -fexperimental-library. Switch to the newest installed stable
    # Xcode 26 when the default is older; newer images are left untouched.
    - name: Select Xcode (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        current="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
        if [ "${current%%.*}" -ge 26 ]; then
          echo "Using the default Xcode ${current}"
          exit 0
        fi
        newest="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' \
          | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -n 1 || true)"
        if [ -z "${newest}" ]; then
          echo "::error::Xcode ${current} lacks std::jthread and no Xcode 26 is installed"
          exit 1
        fi
        sudo xcode-select -s "${newest}/Contents/Developer"
        echo "Selected $(xcodebuild -version | head -n 1) (default was ${current})"

    - name: Configure (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        BUILD_DIR: ${{ inputs.build-dir }}
        CC_INPUT: ${{ inputs.cc }}
        CXX_INPUT: ${{ inputs.cxx }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        args="-DCMAKE_BUILD_TYPE=${BUILD_TYPE}"
        if [ -n "${CC_INPUT}" ]; then
          args="${args} -DCMAKE_C_COMPILER=${CC_INPUT}"
        fi
        if [ -n "${CXX_INPUT}" ]; then
          args="${args} -DCMAKE_CXX_COMPILER=${CXX_INPUT}"
        fi
        # shellcheck disable=SC2086 # EXTRA_ARGS is an intentional argument list.
        cmake -B "${BUILD_DIR}" ${args} ${EXTRA_ARGS}

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        BUILD_DIR: ${{ inputs.build-dir }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      # The Visual Studio generator is multi-config, so CMAKE_BUILD_TYPE does
      # not select the configuration (the Build step's --config does). It does
      # choose the tree's primary configuration (LUMA_PRIMARY_CONFIG left
      # empty), whose binaries the root CMakeLists.txt places at the
      # build-directory root, matching the Unix layout; the Build step passes
      # the same value to --config.
      # Split EXTRA_ARGS on whitespace and splat so each token is a separate
      # argument (mirrors the Unix branch's word-splitting); a bare
      # "$env:EXTRA_ARGS" would pass all tokens to cmake as one argument.
      # The separators MUST be cast to [char[]]: a bare @(" ", "`t") is an
      # object[], which binds String.Split(String, StringSplitOptions) and
      # coerces the array to a single 2-char separator string that never
      # matches — so nothing splits. [char[]] binds the char[] overload.
      run: |
        $extra = "$env:EXTRA_ARGS".Split(
          [char[]]@(" ", "`t"), [System.StringSplitOptions]::RemoveEmptyEntries)
        cmake -B "$env:BUILD_DIR" "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE" @extra

    - name: Build
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        BUILD_DIR: ${{ inputs.build-dir }}
      # An explicit job count is required. `cmake --build --parallel` with no
      # number expands to `make -j` (UNLIMITED jobs) under the Unix Makefiles
      # generator, spawning hundreds of concurrent compiles that exhaust the
      # runner's RAM and get the VM OOM-killed ("runner received a shutdown
      # signal"). Use the detected core count — portable across Linux
      # (nproc), macOS (sysctl), and Git-bash on Windows.
      run: |
        jobs="$(nproc 2>/dev/null \
          || sysctl -n hw.ncpu 2>/dev/null \
          || echo "${NUMBER_OF_PROCESSORS:-2}")"
        cmake --build "${BUILD_DIR}" --config "${BUILD_TYPE}" --parallel "${jobs}"
