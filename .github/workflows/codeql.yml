# ─────────────────────────────────────────────────────────────
# Luma — CodeQL Analysis Workflow
#
# Runs GitHub's CodeQL static analysis over the C++ sources on
# every push and PR targeting main, plus a weekly scheduled scan.
# The project is built manually so CodeQL can observe the full
# compilation.
# ─────────────────────────────────────────────────────────────

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Weekly Monday 04:23 UTC.

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure and build
        uses: ./.github/actions/cmake-build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          category: "/language:c-cpp"
