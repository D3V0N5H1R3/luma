# ─────────────────────────────────────────────────────────────
# Luma — VS Code Extension Release Workflow
#
# Triggered on version tags (vscode-v*.*.*). Builds, validates,
# and publishes the VS Code extension to the Visual Studio
# Marketplace.
# ─────────────────────────────────────────────────────────────

name: Release — VS Code Extension

on:
  push:
    tags: ["vscode-v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish VS Code Extension
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and package extension
        id: build
        uses: ./.github/actions/build-vscode-extension

      - name: Publish to Visual Studio Marketplace
        # Invoke the lockfile-pinned vsce installed by the build action's
        # `npm ci`, not `npx vsce` (which can silently fetch an unpinned
        # version from the registry) — this step holds the Marketplace PAT.
        run: ./node_modules/.bin/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#vscode-v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: VS Code Extension v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: extensions/vscode/${{ steps.build.outputs.vsix-file }}
