# ─────────────────────────────────────────────────────────────
# Luma — JavaScript Lint Workflow
#
# Runs ESLint over the project-authored JavaScript in
# external/gui-framework/ on every push and PR targeting main
# that touches those files or the lint configuration. These files
# are the GraphicalUi web-view renderer — project-authored despite
# living under external/.
#
# The renderers/*.js fragments are spliced into gui-renderer.js's
# IIFE at build time (scripts/generate_gui_assets.mjs), so they
# share its module-private helpers. eslint.config.mjs disables the
# two cross-scope rules (no-undef, no-unused-vars) for those
# fragments; the concatenated framework is exercised at runtime by
# the node --test suite in ci-gui-framework.yml.
# ─────────────────────────────────────────────────────────────

name: CI — JavaScript

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/ci-javascript.yml"
      - "external/gui-framework/**/*.js"
      - "external/gui-framework/eslint.config.mjs"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install ESLint
        working-directory: external/gui-framework
        # Pin @eslint/js to major 9 to match eslint 9 — the latest @eslint/js
        # (10.x) peers on eslint 10 and can make npm's resolver reject the install.
        run: |
          echo '{ "private": true, "type": "module" }' > package.json
          npm install --no-save --no-audit --no-fund \
            eslint@9 @eslint/js@9

      - name: Run ESLint
        working-directory: external/gui-framework
        run: |
          npx eslint \
            gui-renderer.js \
            gui-charts.js \
            gui-subscriptions.js \
            renderers/basic.js \
            renderers/layout.js \
            renderers/advanced.js \
            renderers/interaction.js

