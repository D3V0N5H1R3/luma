# ─────────────────────────────────────────────────────────────
# Luma — Fuzz Workflow
#
# Builds the libFuzzer targets once, then fuzzes each target in
# parallel. The fuzz binaries link the sanitizer runtimes (ASan and
# UBSan) statically, so the fan-out jobs only need to download and run
# them — no toolchain reinstall required.
#
# Each target's corpus is seeded from the checked-in fuzz/corpus/<name>
# and persisted between scheduled runs via actions/cache, so coverage
# accumulates continuously instead of starting cold each run.
# ─────────────────────────────────────────────────────────────

name: "Fuzz"

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 03:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fuzzers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang
        uses: ./.github/actions/apt-install
        with:
          packages: clang

      # AddressSanitizer catches memory errors; UndefinedBehaviorSanitizer turns
      # silent undefined behaviour (signed overflow, bad shifts, …) into a
      # crash, and -fno-sanitize-recover makes every finding abort so libFuzzer
      # records it.
      - name: Configure
        run: |
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined" \
            -DLUMA_BUILD_FUZZ=ON -DLUMA_BUILD_TESTS=OFF

      # Build only the fuzzers (the luma_fuzzers aggregate target): the default
      # "all" also compiled every test, the language server and the debugger
      # under the sanitizers, which exhausted the runner before any fuzzer ran.
      # An explicit job count is required: a bare `--parallel` becomes `make -j`
      # (unlimited) under the Makefiles generator and OOM-kills the runner,
      # especially for these sanitizer-instrumented compiles.
      - name: Build
        run: cmake --build build-fuzz --target luma_fuzzers --parallel "$(nproc)"

      # Package just the fuzz executables; tar preserves the executable bit
      # that upload-artifact would otherwise drop. A file list (-T) avoids
      # word-splitting the find output. CMAKE_RUNTIME_OUTPUT_DIRECTORY places
      # every executable at the build-tree root, not in build-fuzz/fuzz/.
      - name: Package fuzzers
        working-directory: build-fuzz
        run: |
          find . -maxdepth 1 -type f -executable -name 'fuzz_*' -printf '%P\n' > fuzzer-list.txt
          if [ ! -s fuzzer-list.txt ]; then
            echo "::error::no fuzz_* executables found in build-fuzz" >&2
            exit 1
          fi
          tar -czf "$GITHUB_WORKSPACE/fuzzers.tar.gz" -T fuzzer-list.txt

      - name: Upload fuzzers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzers
          path: fuzzers.tar.gz
          retention-days: 1

  fuzz:
    name: Fuzz — ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # Pipeline targets
          - target: fuzz_lexer
            time: 120
          - target: fuzz_parser
            time: 120
          - target: fuzz_type_checker
            time: 120
          - target: fuzz_compiler
            time: 120
          - target: fuzz_vm
            time: 120
          - target: fuzz_include_resolver
            time: 120
          - target: fuzz_linter
            time: 120
          - target: fuzz_optimizer
            time: 120
          - target: fuzz_structured
            time: 300
          # Stdlib and external-input boundary targets
          - target: fuzz_bytecode_deserializer
            time: 120
          - target: fuzz_json
            time: 120
          - target: fuzz_json_stdlib
            time: 120
          - target: fuzz_csv
            time: 120
          - target: fuzz_xml
            time: 120
          - target: fuzz_datetime
            time: 120
          - target: fuzz_protocol
            time: 120
          - target: fuzz_compression
            time: 120
          - target: fuzz_encoder
            time: 120
          - target: fuzz_keyvaluestore
            time: 120
          - target: fuzz_hash
            time: 120
          - target: fuzz_path
            time: 120
          - target: fuzz_decimal
            time: 120
          - target: fuzz_random
            time: 120
          - target: fuzz_http
            time: 120
          - target: fuzz_process
            time: 120
          - target: fuzz_regex
            time: 120
          - target: fuzz_string
            time: 120
          - target: fuzz_terminal
            time: 120

    steps:
      - name: Checkout seed corpus and dictionary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            fuzz/corpus
            fuzz/dictionary.txt
          sparse-checkout-cone-mode: false

      - name: Download fuzzers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzzers

      - name: Extract fuzzers
        run: |
          mkdir -p fuzzers
          tar -xzf fuzzers.tar.gz -C fuzzers
          chmod +x fuzzers/*

      # Persist the evolving corpus between scheduled runs so coverage
      # accumulates instead of starting cold. The run-id key always misses
      # (forcing a fresh save each run), while restore-keys pulls the most
      # recent previous corpus for this target.
      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          MAX_TIME: ${{ matrix.time }}
        run: |
          # The writable working corpus is seeded from the checked-in seeds at
          # fuzz/corpus/<name> (the target name minus its fuzz_ prefix) and
          # grows with any new coverage-increasing inputs libFuzzer discovers.
          work="corpus/$TARGET"
          seed="fuzz/corpus/${TARGET#fuzz_}"
          mkdir -p "$work"
          seeds=()
          [ -d "$seed" ] && seeds+=("$seed")
          # -dict guides mutations with Luma keywords and stdlib names.
          # -timeout reports a hung input (keep in step with
          # LUMA_FUZZ_UNIT_TIMEOUT in fuzz/CMakeLists.txt) instead of letting it
          # silently consume the whole run; -close_fd_mask=1 closes the target's
          # stdout so programs that print cannot flood the log.
          ./fuzzers/"$TARGET" "$work" "${seeds[@]}" \
            -dict=fuzz/dictionary.txt -timeout=25 -close_fd_mask=1 \
            -max_total_time="$MAX_TIME" -print_final_stats=1

      # Minimise the corpus so the cached set stays small while preserving
      # coverage, keeping future runs fast and the cache within size limits.
      - name: Minimise corpus
        if: success()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          work="corpus/$TARGET"
          min="corpus-min/$TARGET"
          mkdir -p "$min"
          ./fuzzers/"$TARGET" -merge=1 -timeout=25 -close_fd_mask=1 "$min" "$work"
          rm -rf "$work"
          mv "$min" "$work"

      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore
