# ─────────────────────────────────────────────────────────────
# Luma — Zed Extension CI Workflow
#
# Builds and validates the Zed extension and runs tree-sitter
# grammar tests on every push and PR targeting main that
# touches Zed extension source files.
# ─────────────────────────────────────────────────────────────

name: CI — Zed Extension

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/actions/build-zed-extension/**"
      - ".github/workflows/ci-zed.yml"
      - "extensions/zed/**"
      - "extensions/tests/**"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zed:
    name: Zed Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build extension
        uses: ./.github/actions/build-zed-extension

  grammar-tests:
    name: Tree-sitter Grammar Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/zed/grammars/tree-sitter-luma/package-lock.json

      - name: Install tree-sitter dependencies
        working-directory: extensions/zed/grammars/tree-sitter-luma
        run: npm ci

      - name: Generate parser
        working-directory: extensions/zed/grammars/tree-sitter-luma
        # Use the lockfile-pinned tree-sitter-cli from `npm ci` rather than
        # `npx tree-sitter`, which would fetch an unpinned latest CLI at runtime
        # and make parser generation non-reproducible.
        run: ./node_modules/.bin/tree-sitter generate

      - name: Parse fixture files
        run: node extensions/tests/parse_fixtures.js
