# ─────────────────────────────────────────────────────────────
# Luma — Python Lint, Format & Test Workflow
#
# Runs Ruff (lint + format check) over the project's Python tooling
# and the extension tooling unit tests on every push and PR targeting
# main that touches Python sources or the Ruff configuration. Rule
# configuration lives in ruff.toml.
# ─────────────────────────────────────────────────────────────

name: CI — Python

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/ci-python.yml"
      - "ruff.toml"
      - "**/*.py"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.15.17

      - name: Run Ruff lint
        run: ruff check --output-format=github .

      - name: Check Ruff formatting
        run: ruff format --check --diff .

      - name: Run extension tooling unit tests
        working-directory: extensions/shared
        run: python -m unittest discover -p "test_*.py"
