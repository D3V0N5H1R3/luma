# ─────────────────────────────────────────────────────────────
# Luma — Python Lint, Format & Test Workflow
#
# Runs Ruff (lint + format check) over the project's Python tooling,
# the extension tooling unit tests, the agent hook unit tests, the
# Git hook regression tests, and the prompt pipeline unit tests on
# every push and PR targeting main that touches Python sources, the
# Git hooks, or the Ruff configuration.
# Rule configuration lives in ruff.toml.
# ─────────────────────────────────────────────────────────────

name: CI — Python

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/ci-python.yml"
      - "CMakePresets.json"
      - "ruff.toml"
      - "**/*.py"
      - "scripts/git-hooks/**"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.15.17

      - name: Run Ruff lint
        run: ruff check --output-format=github .

      - name: Check Ruff formatting
        run: ruff format --check --diff .

      - name: Run extension tooling unit tests
        working-directory: extensions/shared
        run: python -m unittest discover -p "test_*.py"

      - name: Run agent hook unit tests
        run: python -m unittest discover -s scripts/agent-hooks -p "test_*.py"

      - name: Run Git hook regression tests
        run: python -m unittest discover -s scripts -p "test_git_hooks.py"

      # Also checks that every preset in CMakePresets.json has a build preset
      # configure.py --build can run, hence CMakePresets.json in paths: above.
      - name: Run configure.py unit tests
        run: python -m unittest discover -s scripts -p "test_configure.py"

      - name: Run prompt pipeline unit tests
        run: python -m unittest discover -s scripts/pipeline -p "test_*.py"
