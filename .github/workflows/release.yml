# ─────────────────────────────────────────────────────────────
# Luma — Release Workflow
#
# Triggered on version tags (v*.*.*). Builds release binaries
# for all platforms (Linux x86_64, Linux aarch64/Raspberry Pi,
# macOS, Windows), validates on Debian, Kali Linux, Fedora,
# and Arch Linux, then creates a GitHub Release with an
# auto-generated changelog and attached binaries.
#
# Each platform ships a full bundle (luma-{os}-{arch}, all three binaries)
# plus one archive per binary (luma_lsp, luma_dap), all as tar.gz / zip so the
# executable bit survives the artifact round-trip, alongside a SHA256SUMS
# manifest. Asset names follow extensions/BINARY_ASSETS.md (x86_64 / aarch64).
# ─────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      # Build every platform even if one fails, so a release shows the full
      # picture rather than stopping at the first failure.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64

          - os: macos-latest
            asset_os: macos
            asset_arch: aarch64

          - os: windows-latest
            asset_os: windows
            asset_arch: x86_64

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache build directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build
          key: cmake-release-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'core/**', 'shared/**', 'debugger/**', 'language-server/**') }}
          restore-keys: |
            cmake-release-${{ runner.os }}-

      - name: Configure and build
        uses: ./.github/actions/cmake-build

      # Runs the full CTest suite (C++ unit tests and Luma feature tests).
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Release

      # Package the full distribution bundle (luma-{os}-{arch}, all three
      # binaries) plus one archive per binary (luma_lsp, luma_dap) so each
      # editor extension downloads only what it needs. The {os}-{arch} suffix
      # follows extensions/BINARY_ASSETS.md (x86_64 / aarch64, not x64 / arm64).
      - name: Package binaries
        uses: ./.github/actions/package-binaries
        with:
          suffix: ${{ matrix.asset_os }}-${{ matrix.asset_arch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luma-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: |
            luma-*
            luma_lsp-*
            luma_dap-*
          retention-days: 30

  # ── Raspberry Pi OS release binary (native ARM64 runner) ──
  build-rpi:
    name: Build — Raspberry Pi OS (ARM64)
    uses: ./.github/workflows/build-raspberry-pi.yml
    with:
      upload-artifact: true
      artifact-name: luma-linux-aarch64

  # ── Validate release on additional Linux distributions ──
  # The distro list lives in .github/linux-distros.json so it is defined once
  # and shared with the CI workflow. resolve-distro-matrix.yml loads it into a
  # matrix that the validation job consumes via fromJSON.
  setup-linux-matrix:
    name: Resolve Linux distro matrix
    uses: ./.github/workflows/resolve-distro-matrix.yml

  validate-linux-distros:
    name: Validate — ${{ matrix.distro }}
    needs: setup-linux-matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-linux-matrix.outputs.matrix) }}

    uses: ./.github/workflows/reusable-linux-build.yml
    with:
      image: ${{ matrix.image }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      install-cmd: ${{ matrix.install-cmd }}

  # ── Package VS Code extension ──
  vscode-extension:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and package extension
        uses: ./.github/actions/build-vscode-extension

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luma-vscode-extension
          path: extensions/vscode/*.vsix
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build, build-rpi, validate-linux-distros, vscode-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Generate changelog
        run: |
          prev_tag=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$prev_tag" ]; then
            git log --pretty=format:"- %s (%h)" --no-merges > release-notes.md
          else
            git log "${prev_tag}..HEAD" --pretty=format:"- %s (%h)" --no-merges > release-notes.md
          fi

      # One checksum manifest covering every release archive. Editor extensions
      # download SHA256SUMS and verify their archive against it before
      # extracting (see extensions/shared/download-spec.md). Hashing each file
      # from its own directory keeps the manifest keyed by bare asset name.
      - name: Generate SHA256SUMS
        run: |
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort | while read -r file; do
            ( cd "$(dirname "$file")" && sha256sum "$(basename "$file")" )
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body_path: release-notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.vsix
            SHA256SUMS
