# ─────────────────────────────────────────────────────────────
# Luma — Reusable Raspberry Pi OS Build (ARM64)
#
# Builds and tests Luma for Raspberry Pi OS (ARM64) on a native
# GitHub-hosted ARM64 Linux runner (free for public repositories),
# running the arm64 Debian container directly — no QEMU emulation,
# which is far too slow to build this codebase within a CI timeout.
# The toolchain parameters (image, compilers, install command) are
# defined here once so ci.yml and release.yml share a single
# definition; callers opt into artifact upload for release builds.
#
# Debian trixie (GCC 14) is used as the ARM64 proxy rather than the
# bookworm base of current Raspberry Pi OS: Luma requires a C++20
# <format> implementation, which only ships in libstdc++ 13+, whereas
# bookworm's default toolchain is GCC 12. Trixie exercises the same
# linux/arm64 target with a toolchain new enough to build the project.
#
# Thin wrapper over reusable-linux-build.yml.
# ─────────────────────────────────────────────────────────────

name: Reusable — Raspberry Pi OS Build (ARM64)

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: Whether to package and upload the built binaries.
        required: false
        type: boolean
        default: false
      artifact-name:
        description: Name of the uploaded artifact (and tarball stem).
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-linux-build.yml
    with:
      image: arm64v8/debian:trixie
      cc: gcc
      cxx: g++
      install-cmd: apt-get update -q && apt-get install -y cmake gcc g++ make
      # Run on a native ARM64 runner so the arm64 container executes without
      # QEMU; leaving platform empty skips the emulation setup entirely.
      runner: ubuntu-24.04-arm
      upload-artifact: ${{ inputs.upload-artifact }}
      artifact-name: ${{ inputs.artifact-name }}
