# ─────────────────────────────────────────────────────────────
# Luma — CI Workflow
#
# Builds and tests the Luma interpreter on all supported
# platforms (Windows, Ubuntu, macOS, Debian, Kali Linux,
# Fedora, Arch Linux, Raspberry Pi OS) on every push and
# PR targeting main.
#
# Documentation-only changes are handled by docs.yml so they do
# not trigger this build/test matrix.
# ─────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - ".clang-format"
      - ".clang-tidy"
      - ".github/actions/**"
      - ".github/workflows/linux-distros.json"
      - ".github/workflows/build-raspberry-pi.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/resolve-distro-matrix.yml"
      - ".github/workflows/reusable-linux-build.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "core/**"
      - "debugger/**"
      - "examples/**"
      - "fuzz/**"
      - "language-server/**"
      - "scripts/**"
      - "shared/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GCC version used by the (non-matrix) coverage job. The build matrix below
  # deliberately pins its own compilers, so those versions stay inline.
  COVERAGE_GCC_VERSION: "13"

jobs:
  build:
    name: ${{ matrix.os }} — ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    # Upper bound covers the cached build, the CTest suite, and (on the gcc-14
    # job) the full headless example sweep run by scripts/run_examples.py. The
    # ceiling accommodates the slowest entry: the gcc-13 sanitizer build, whose
    # ASan/UBSan-instrumented, non-PIE binaries compile and test noticeably
    # slower than the plain jobs (~35 min, versus ~12-28 min for
    # gcc-14/clang/MSVC) and were intermittently hitting the previous 35-minute
    # limit. Warm-cache plain runs finish well under this.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # The first three entries are the primary per-platform builds: normal
        # optimized executables that are tested and uploaded as the downloadable
        # binaries (luma-<os>-<compiler>). Only the Ubuntu GCC 14 job also runs
        # the headless example sweep (scripts/run_examples.py), so it alone
        # installs WebKitGTK for the GraphicalUi examples.
        #
        # The fourth entry (Ubuntu GCC 13 + sanitizers) is a runtime-safety
        # check, NOT a build meant for use: it enables AddressSanitizer + UBSan
        # (-DLUMA_FEATURE_SANITIZERS=ON) to catch buffer overflows,
        # use-after-free, and undefined behaviour. Its uploaded binary is
        # instrumented — slower, built non-PIE, and dependent on the sanitizer
        # runtime — so download the plain gcc-14 artifact if you just want to run
        # Luma on Linux. See build.instructions.md section 5 (Sanitizer
        # Configuration) and cmake/LumaCompilerFlags.cmake.
        include:
          - os: ubuntu-latest
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            binary: build/luma
            lsp_binary: build/luma_lsp
            dap_binary: build/luma_dap

          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            binary: build/luma
            lsp_binary: build/luma_lsp
            dap_binary: build/luma_dap

          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            binary: build/Release/luma.exe
            lsp_binary: build/Release/luma_lsp.exe
            dap_binary: build/Release/luma_dap.exe

          # Runtime-safety check (ASan + UBSan) — see the matrix note above; the
          # uploaded binary is instrumented, not for general use. GCC 13 matches
          # the coverage job's pinned toolchain.
          - os: ubuntu-latest
            compiler: gcc-13-sanitizers
            cc: gcc-13
            cxx: g++-13
            sanitizers: true
            binary: build/luma
            lsp_binary: build/luma_lsp
            dap_binary: build/luma_dap

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'core/**', 'shared/**', 'debugger/**', 'language-server/**') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Install GCC
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.cc }} ${{ matrix.cxx }}

      # Only the gcc-14 job runs the headless example sweep, which includes the
      # GraphicalUi (gui_*, solaris_*) examples. Without WebKitGTK the module
      # compiles to its "unavailable" stub and every GUI example fails, so this
      # job needs the WebKit development package that provides webkit2gtk-4.1.
      # macOS (system WebKit) and Windows (WebView2) already have a backend.
      - name: Install WebKitGTK (headless GUI examples)
        if: matrix.compiler == 'gcc-14'
        uses: ./.github/actions/apt-install
        with:
          packages: libwebkit2gtk-4.1-dev

      # AddressSanitizer reserves a large shadow-memory region at a fixed
      # address. CI runners with high ASLR entropy (vm.mmap_rnd_bits up to 32)
      # can place the randomized PIE executable over that region, crashing every
      # instrumented binary at startup with no diagnostic. Lower the entropy to a
      # supported value; the sanitizer link flags additionally build the binaries
      # non-PIE (see cmake/LumaCompilerFlags.cmake). See google/sanitizers#1614.
      - name: Reduce ASLR entropy for sanitizers
        if: matrix.sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          extra-args: ${{ matrix.sanitizers && '-DLUMA_FEATURE_SANITIZERS=ON' || '' }}

      - name: Verify binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          for b in luma luma_lsp luma_dap; do
            test -f "build/$b" || { echo "::error::build/$b not found"; exit 1; }
          done
          build/luma --version

      - name: Verify binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($b in "luma", "luma_lsp", "luma_dap") {
            if (-not (Test-Path "build\Release\$b.exe")) {
              Write-Error "build\Release\$b.exe not found"
              exit 1
            }
          }
          build\Release\luma.exe --version

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Release

      # Runs only on the primary Linux build. scripts/run_examples.py executes
      # every program under examples/ headlessly — GUI via LUMA_GUI_HEADLESS,
      # terminal TUIs via scripted keys, console programs via scripted stdin —
      # and additionally runs any embedded @test blocks. It owns the single
      # skip list, so CI gets the same coverage developers get locally.
      - name: Set up Python
        if: matrix.compiler == 'gcc-14'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate examples
        if: matrix.compiler == 'gcc-14'
        run: python scripts/run_examples.py

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luma-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.lsp_binary }}
            ${{ matrix.dap_binary }}
          retention-days: 7

  static-analysis:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    # The sweep is split into shards that run as concurrent jobs, so together
    # they still cover every source file but each finishes in roughly a quarter
    # of the wall-clock. A single job — even parallelised across the runner's
    # cores — had grown past a 45-minute ceiling once every file compiled
    # cleanly on Clang and the slow path-sensitive analyzer checks all ran.
    timeout-minutes: 30
    strategy:
      # Report every shard's findings rather than cancelling the rest on the
      # first failure — clang-tidy diagnostics in one shard say nothing about
      # the others.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-tidy
        uses: ./.github/actions/apt-install
        with:
          packages: clang-tidy clang

      # Only configure (to generate compile_commands.json and configured
      # headers); clang-tidy parses the sources itself, so a full build is
      # unnecessary here.
      - name: Configure with compile_commands.json
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      # The real-bug categories escalated to errors are defined once in
      # .clang-tidy (WarningsAsErrors); CI relies on that single source of truth
      # rather than passing its own --warnings-as-errors. Style checks stay
      # advisory. The file list is sorted for a stable assignment, sliced into
      # this shard (round-robin: file N goes to shard N mod 4 — the union of all
      # shards is every file, with none shared), then analysed in parallel (one
      # clang-tidy process per core). Windows-only *_win32.cpp files are excluded:
      # they are not in this Linux build's compile_commands.json, so clang-tidy
      # would parse them with default flags and fail on their unconditional
      # <windows.h>/<io.h> includes. Newline-delimited is safe here because the
      # project's snake_case source-file convention means no path contains a
      # space or newline. xargs exits non-zero if any invocation fails.
      - name: Run clang-tidy (shard ${{ matrix.shard }} of 4)
        run: |
          set -o pipefail
          find core language-server/source debugger/source shared -name '*.cpp' \
            ! -name '*_win32.cpp' \
            | sort \
            | awk 'NR % 4 == ${{ matrix.shard }}' \
            | xargs -P "$(nproc)" -n 1 clang-tidy -p build \
            2>&1 | tee clang-tidy-report.txt

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-tidy-report-shard-${{ matrix.shard }}
          path: clang-tidy-report.txt

  formatting:
    name: Formatting (clang-format)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        uses: ./.github/actions/apt-install
        with:
          packages: clang-format

      # Mirrors the `format` target in cmake/LumaRunClangTool.cmake: clang-format
      # covers core, shared, language-server/source, debugger/source, tests, and
      # fuzz (both *.cpp and *.hpp). --dry-run --Werror fails the job when a file
      # is not formatted, without modifying any files.
      - name: Check clang-format
        run: |
          set -o pipefail
          find core shared language-server/source debugger/source tests fuzz \
            \( -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format --dry-run --Werror {} + \
            2>&1 | tee clang-format-report.txt

      - name: Upload clang-format report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-format-report
          path: clang-format-report.txt

  warning-sync:
    name: Warning Flag Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Confirms the GCC/Clang warning flags in cmake/LumaCompilerFlags.cmake
      # stay consistent with the checks enabled in .clang-tidy. --strict fails
      # the job on any mismatch (the script is otherwise advisory).
      - name: Check warning/clang-tidy sync
        run: python scripts/check_warning_sync.py --strict

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-${{ env.COVERAGE_GCC_VERSION }} g++-${{ env.COVERAGE_GCC_VERSION }} lcov

      - name: Configure and build with coverage
        uses: ./.github/actions/cmake-build
        with:
          build-type: Debug
          cc: gcc-${{ env.COVERAGE_GCC_VERSION }}
          cxx: g++-${{ env.COVERAGE_GCC_VERSION }}
          extra-args: -DLUMA_FEATURE_COVERAGE=ON

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Collect coverage
        run: |
          # gcc-13's gcov can emit spurious negative execution counts for
          # inlined system-header code (e.g. char_traits.h); lcov 2.x treats
          # that as a fatal "negative" error, so allow it alongside "mismatch".
          lcov --capture --directory build --output-file coverage.info \
               --ignore-errors mismatch,negative
          lcov --remove coverage.info '/usr/*' '*/tests/*' \
               --output-file coverage-filtered.info --ignore-errors negative
          lcov --list coverage-filtered.info

      - name: Check coverage threshold
        run: |
          # Extract overall line coverage percentage from lcov summary.
          COVERAGE=$(lcov --summary coverage-filtered.info 2>&1 | grep 'lines' | grep -oP '[\d.]+%' | head -1 | tr -d '%')
          echo "Line coverage: ${COVERAGE}%"
          THRESHOLD=60
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-filtered.info
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ThreadSanitizer is configured correctly here — it links a
    # position-independent executable (unlike the ASan matrix, whose -no-pie
    # dodge of the ubuntu-24.04 high-ASLR shadow collision is actively wrong for
    # TSan) and lowers the ASLR entropy to a libtsan-supported value
    # (google/sanitizers#1614).
    #
    # It is nonetheless kept NON-BLOCKING: on the current hosted ubuntu-24.04
    # image, libtsan cannot map its shadow memory and every luma_core-linked
    # binary SIGSEGVs before main() with no TSan diagnostic. This reproduced
    # across every configuration tried (ASLR off, mmap_rnd_bits=28, -no-pie, and
    # PIE), so it is a runner-image/libtsan limitation outside this repo's
    # control, not a data race. The gcc-13 AddressSanitizer/UBSan job is the
    # active, gating sanitizer check; TSan is retained (correctly configured, so
    # it self-heals automatically when a future runner image ships a working
    # libtsan) purely as best-effort race detection. Do NOT remove
    # continue-on-error until a run confirms TSan actually starts on the image.
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang
        uses: ./.github/actions/apt-install
        with:
          packages: clang

      # ubuntu-24.04 raised the default ASLR entropy to vm.mmap_rnd_bits=32, which
      # libtsan cannot map its shadow against; lower it to the supported value.
      # No -no-pie here — TSan requires PIE (see the job-level comment).
      - name: Reduce ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          cmake -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure
        env:
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/scripts/tsan_suppressions.txt"

  # ── Optional-feature builds (exercise the LUMA_HAS_* stub paths) ──
  # The default matrix builds with every feature ON, so the disabled code paths
  # behind LUMA_HAS_TLS / LUMA_HAS_WEBVIEW are never compiled or run there. These
  # jobs build with each feature OFF and run the full test suite so the stub
  # paths (Http "requires TLS", Random.secure_* failures, GraphicalUi
  # unavailable) stay implemented and green.
  feature-flags:
    name: Feature Flag Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: no-tls
            args: -DLUMA_FEATURE_TLS=OFF
          - label: no-webview
            args: -DLUMA_FEATURE_WEBVIEW=OFF

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-14 g++-14

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          cc: gcc-14
          cxx: g++-14
          extra-args: ${{ matrix.args }}

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

  # ── Linux distribution builds (broad distro coverage via containers) ──
  # The distro list lives in .github/workflows/linux-distros.json so it is defined once
  # and shared with the release workflow. resolve-distro-matrix.yml loads it
  # into a matrix that the build job consumes via fromJSON.
  setup-linux-matrix:
    name: Resolve Linux distro matrix
    uses: ./.github/workflows/resolve-distro-matrix.yml

  build-linux-distros:
    name: ${{ matrix.distro }}
    needs: setup-linux-matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-linux-matrix.outputs.matrix) }}

    uses: ./.github/workflows/reusable-linux-build.yml
    with:
      image: ${{ matrix.image }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      install-cmd: ${{ matrix.install-cmd }}

  # ── Raspberry Pi OS (native ARM64 runner) ──
  build-rpi:
    name: Raspberry Pi OS (ARM64)
    uses: ./.github/workflows/build-raspberry-pi.yml
