# ─────────────────────────────────────────────────────────────
# Luma — CI Workflow
#
# Builds and tests the Luma interpreter on all supported
# platforms (Windows, Ubuntu, macOS, Debian, Kali Linux,
# Fedora, Arch Linux, Raspberry Pi OS) on every push and
# PR targeting main.
#
# Documentation-only changes are handled by docs.yml so they do
# not trigger this build/test matrix.
# ─────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - ".clang-format"
      - ".clang-tidy"
      - ".github/actions/**"
      - ".github/linux-distros.json"
      - ".github/workflows/build-raspberry-pi.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/resolve-distro-matrix.yml"
      - ".github/workflows/reusable-linux-build.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "core/**"
      - "debugger/**"
      - "examples/**"
      - "fuzz/**"
      - "language-server/**"
      - "scripts/**"
      - "shared/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GCC version used by the (non-matrix) coverage job. The build matrix below
  # deliberately pins its own compilers, so those versions stay inline.
  COVERAGE_GCC_VERSION: "13"

jobs:
  build:
    name: ${{ matrix.os }} — ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    # Upper bound covers the cached build, the CTest suite, and (on the gcc-14
    # job) the full headless example sweep run by scripts/run_examples.py. The
    # ceiling accommodates a cold-cache full build on the slowest runner
    # (Windows/MSVC); warm-cache runs finish well under it.
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            binary: build/luma
            lsp_binary: build/luma_lsp
            dap_binary: build/luma_dap

          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            binary: build/luma
            lsp_binary: build/luma_lsp
            dap_binary: build/luma_dap

          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            binary: build/Release/luma.exe
            lsp_binary: build/Release/luma_lsp.exe
            dap_binary: build/Release/luma_dap.exe

          - os: ubuntu-latest
            compiler: gcc-13-sanitizers
            cc: gcc-13
            cxx: g++-13
            sanitizers: true
            binary: build/luma
            lsp_binary: build/luma_lsp
            dap_binary: build/luma_dap

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache build directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'core/**', 'shared/**', 'debugger/**', 'language-server/**') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Install GCC
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.cc }} ${{ matrix.cxx }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          extra-args: ${{ matrix.sanitizers && '-DLUMA_FEATURE_SANITIZERS=ON' || '' }}

      - name: Verify binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          for b in luma luma_lsp luma_dap; do
            test -f "build/$b" || { echo "::error::build/$b not found"; exit 1; }
          done
          build/luma --version

      - name: Verify binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($b in "luma", "luma_lsp", "luma_dap") {
            if (-not (Test-Path "build\Release\$b.exe")) {
              Write-Error "build\Release\$b.exe not found"
              exit 1
            }
          }
          build\Release\luma.exe --version

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Release

      # Runs only on the primary Linux build. scripts/run_examples.py executes
      # every program under examples/ headlessly — GUI via LUMA_GUI_HEADLESS,
      # terminal TUIs via scripted keys, console programs via scripted stdin —
      # and additionally runs any embedded @test blocks. It owns the single
      # skip list, so CI gets the same coverage developers get locally.
      - name: Set up Python
        if: matrix.compiler == 'gcc-14'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate examples
        if: matrix.compiler == 'gcc-14'
        run: python scripts/run_examples.py

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luma-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.lsp_binary }}
            ${{ matrix.dap_binary }}
          retention-days: 7

  static-analysis:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install clang-tidy
        uses: ./.github/actions/apt-install
        with:
          packages: clang-tidy clang

      # Only configure (to generate compile_commands.json and configured
      # headers); clang-tidy parses the sources itself, so a full build is
      # unnecessary here.
      - name: Configure with compile_commands.json
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      # The real-bug categories escalated to errors are defined once in
      # .clang-tidy (WarningsAsErrors); CI relies on that single source of truth
      # rather than passing its own --warnings-as-errors. Style checks stay
      # advisory. `-exec ... {} +` batches files like xargs and returns non-zero
      # if any invocation fails, without the word-splitting of `find | xargs`.
      - name: Run clang-tidy
        run: |
          find core language-server/source debugger/source shared -name '*.cpp' \
            -exec clang-tidy -p build {} +

  formatting:
    name: Formatting (clang-format)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install clang-format
        uses: ./.github/actions/apt-install
        with:
          packages: clang-format

      # Mirrors the `format` target in cmake/LumaRunClangTool.cmake: clang-format
      # covers core, shared, language-server/source, debugger/source, tests, and
      # fuzz (both *.cpp and *.hpp). --dry-run --Werror fails the job when a file
      # is not formatted, without modifying any files.
      - name: Check clang-format
        run: |
          find core shared language-server/source debugger/source tests fuzz \
            \( -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format --dry-run --Werror {} +

  warning-sync:
    name: Warning Flag Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Confirms the GCC/Clang warning flags in cmake/LumaCompilerFlags.cmake
      # stay consistent with the checks enabled in .clang-tidy. --strict fails
      # the job on any mismatch (the script is otherwise advisory).
      - name: Check warning/clang-tidy sync
        run: python scripts/check_warning_sync.py --strict

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-${{ env.COVERAGE_GCC_VERSION }} g++-${{ env.COVERAGE_GCC_VERSION }} lcov

      - name: Configure and build with coverage
        uses: ./.github/actions/cmake-build
        with:
          build-type: Debug
          cc: gcc-${{ env.COVERAGE_GCC_VERSION }}
          cxx: g++-${{ env.COVERAGE_GCC_VERSION }}
          extra-args: -DLUMA_FEATURE_COVERAGE=ON

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Collect coverage
        run: |
          lcov --capture --directory build --output-file coverage.info \
               --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/tests/*' \
               --output-file coverage-filtered.info
          lcov --list coverage-filtered.info

      - name: Check coverage threshold
        run: |
          # Extract overall line coverage percentage from lcov summary.
          COVERAGE=$(lcov --summary coverage-filtered.info 2>&1 | grep 'lines' | grep -oP '[\d.]+%' | head -1 | tr -d '%')
          echo "Line coverage: ${COVERAGE}%"
          THRESHOLD=60
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-filtered.info
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          files: coverage-filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Clang
        uses: ./.github/actions/apt-install
        with:
          packages: clang

      - name: Configure
        run: |
          cmake -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure
        env:
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/scripts/tsan_suppressions.txt"

  # ── Optional-feature builds (exercise the LUMA_HAS_* stub paths) ──
  # The default matrix builds with every feature ON, so the disabled code paths
  # behind LUMA_HAS_TLS / LUMA_HAS_WEBVIEW are never compiled or run there. These
  # jobs build with each feature OFF and run the full test suite so the stub
  # paths (Http "requires TLS", Random.secure_* failures, GraphicalUi
  # unavailable) stay implemented and green.
  feature-flags:
    name: Feature Flag Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: no-tls
            args: -DLUMA_FEATURE_TLS=OFF
          - label: no-webview
            args: -DLUMA_FEATURE_WEBVIEW=OFF

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install GCC
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-14 g++-14

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          cc: gcc-14
          cxx: g++-14
          extra-args: ${{ matrix.args }}

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

  # ── Linux distribution builds (broad distro coverage via containers) ──
  # The distro list lives in .github/linux-distros.json so it is defined once
  # and shared with the release workflow. resolve-distro-matrix.yml loads it
  # into a matrix that the build job consumes via fromJSON.
  setup-linux-matrix:
    name: Resolve Linux distro matrix
    uses: ./.github/workflows/resolve-distro-matrix.yml

  build-linux-distros:
    name: ${{ matrix.distro }}
    needs: setup-linux-matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-linux-matrix.outputs.matrix) }}

    uses: ./.github/workflows/reusable-linux-build.yml
    with:
      image: ${{ matrix.image }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      install-cmd: ${{ matrix.install-cmd }}

  # ── Raspberry Pi OS (ARM64 via QEMU emulation) ──
  build-rpi:
    name: Raspberry Pi OS (ARM64)
    uses: ./.github/workflows/build-raspberry-pi.yml
