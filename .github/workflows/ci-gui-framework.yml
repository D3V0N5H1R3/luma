# ─────────────────────────────────────────────────────────────
# Luma — GUI Framework Tests Workflow
#
# Runs the Node.js unit tests for the first-party GraphicalUi browser
# framework (external/gui-framework/) on every push and PR targeting
# main that touches the framework source or its tests. The tests load
# each browser IIFE inside a node:vm sandbox with a fake DOM, so no
# browser and no third-party dependencies are required.
# ─────────────────────────────────────────────────────────────

name: CI — GUI Framework

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/ci-gui-framework.yml"
      - "external/gui-framework/**"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-framework:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      # The default shell is bash, which expands the glob to the explicit test
      # file list before node sees it — so this discovers new *.test.mjs files
      # automatically without relying on node's own glob support.
      - name: Run GUI framework tests
        run: node --test external/gui-framework/tests/*.test.mjs
