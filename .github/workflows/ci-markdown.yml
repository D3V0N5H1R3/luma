# ─────────────────────────────────────────────────────────────
# Luma — Markdown Lint Workflow
#
# Runs markdownlint-cli2 over all first-party Markdown on every push
# and PR targeting main that touches Markdown files or the lint
# configuration. Rule configuration and file globs live in
# .markdownlint-cli2.jsonc.
# ─────────────────────────────────────────────────────────────

name: CI — Markdown

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/ci-markdown.yml"
      - ".markdownlint-cli2.jsonc"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      # File globs and ignores are defined in .markdownlint-cli2.jsonc, so the
      # linter is invoked with no path arguments.
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.22.1
