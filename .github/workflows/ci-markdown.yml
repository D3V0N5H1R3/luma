# ─────────────────────────────────────────────────────────────
# Luma — Markdown Lint Workflow
#
# Runs markdownlint-cli2 over all first-party Markdown on every push
# and PR targeting main that touches Markdown files or the lint
# configuration. Rule configuration and file globs live in
# .markdownlint-cli2.jsonc.
# ─────────────────────────────────────────────────────────────

name: CI — Markdown

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/ci-markdown.yml"
      - ".markdownlint-cli2.jsonc"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # File globs and ignores are defined in .markdownlint-cli2.jsonc, so the
      # linter is invoked with no path arguments.
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.22.1
