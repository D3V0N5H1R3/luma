# ─────────────────────────────────────────────────────────────
# Luma — Zed Extension Release Workflow
#
# Triggered on version tags (zed-v*.*.*). Builds and validates
# the Zed extension, then creates a GitHub Release with the
# compiled WASM binary attached.
#
# Note: Zed extensions are published via their extension
# registry by merging into zed-industries/extensions. This
# workflow validates the build and provides the artifact.
# ─────────────────────────────────────────────────────────────

name: Release — Zed Extension

on:
  push:
    tags: ["zed-v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Release Zed Extension
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: extensions/zed

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build extension
        uses: ./.github/actions/build-zed-extension

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/wasm32-wasip1/release/*.wasm dist/
          cp extension.toml dist/
          cp -r languages dist/
          cp -r grammars dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#zed-v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Zed Extension v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: extensions/zed/dist/**
